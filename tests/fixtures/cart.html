<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amazon.in Shopping Cart</title>
<link rel="stylesheet" href="/mock.css">
</head>
<body class="no-ewc">
<!--NAV-->
<div id="a-page" style="padding-right:0">
    <div class="cart">
        <div id="sc-active-cart">
            <h1>Shopping Cart</h1>
            <div class="sc-list-item" data-asin="B0MOUSY001" data-itemtype="active">
                <div class="sc-thumb">☕</div>
                <div>
                    <div class="sc-product-title">Mousy Cold Brew Coffee Beans, Medium Roast, 2 x 500 g</div>
                    <div class="a-color-success">In stock</div>
                    <div class="sc-delivery"><span>₹40 delivery Thu, 15 Oct</span></div>
                    <b>₹899.00</b>
                </div>
            </div>
            <div class="sc-list-item" data-asin="B0MOUSY002" data-itemtype="active">
                <div class="sc-thumb">🥛</div>
                <div>
                    <div class="sc-product-title">Mousy Barista Oat Milk, 1 l</div>
                    <div class="a-color-success">In stock</div>
                    <div class="sc-delivery"><span>FREE delivery Fri, 16 Oct</span></div>
                    <b>₹249.00</b>
                </div>
            </div>
        </div>
        <div class="cart-side">
            <b>Subtotal (2 items): ₹1,148.00</b>
            <button class="buy-btn" type="button" style="background:#ffd814">Proceed to Buy</button>
        </div>
    </div>
</div>
</body>
</html>
