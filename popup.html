<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amazon — My Personal UX</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <img src="icons/icon48.png" alt="" width="28" height="28">
        <h1>Amazon — My Personal UX</h1>
    </header>

    <div class="tabs">
        <button id="tab-modes" class="tab active" type="button">Modes</button>
        <button id="tab-settings" class="tab" type="button">Settings</button>
    </div>

    <div id="view-modes">
        <div id="modes"></div>
        <h3 class="aff-title">Cashback link</h3>
        <div id="affiliate"></div>
    </div>

    <div id="view-settings" hidden>
        <div id="toggles"></div>
        <h3>My Cards</h3>
        <p class="hint">Comma-separated, e.g. <em>HDFC, Amazon Pay ICICI</em>. Blank for all.</p>
        <input id="cards" type="text" class="input" placeholder="e.g. HDFC, SBI">
    </div>

    <footer>Made with <span class="heart">♥</span> by Sandeep Kiran (Mousy)<br><span id="version"></span></footer>

    <script src="popup.js"></script>
</body>
</html>
